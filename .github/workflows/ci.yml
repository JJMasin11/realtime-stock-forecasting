name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Clone repo
      - uses: actions/setup-python@v5 # Install Python
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . # Lint
